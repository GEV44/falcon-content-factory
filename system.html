<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Falcon Content Factory</title><meta name="robots" content="noindex, nofollow"><link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>:root{color-scheme:dark}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0d10;color:#eef1f4;font:400 17px/1.55 Onest,'Segoe UI',system-ui,sans-serif;padding:24px;box-sizing:border-box}
.c{max-width:520px;display:grid;gap:14px;text-align:center}h1{font:700 30px/1.15 Georgia,serif;margin:0}p{margin:0;color:#c3cad2}a{color:#eef1f4}.s{width:28px;height:28px;border:3px solid #333a44;border-top-color:#eef1f4;border-radius:50%;margin:0 auto;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head>
<body><div class="c" id="c"><div class="s" aria-hidden="true"></div><p>Открываем систему… · Opening the system…</p></div>
<script>
fetch('system.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{
  if(j&&j.url){location.replace(j.url);return;}
  throw 0;
}).catch(()=>{document.getElementById('c').innerHTML='<h1>Система откроется на живом показе</h1><p>Сейчас рабочая система показывается по видеосвязи. Напишите — пришлю доступ на время показа.</p><p style="color:#8b94a0">The live system is shown on a video call. Message us for access during the walkthrough.</p><p><a href="./">← Назад к обзору · Back</a></p>';});
</script></body></html>
